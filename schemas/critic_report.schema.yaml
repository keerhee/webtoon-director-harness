$schema: "https://json-schema.org/draft/2020-12/schema"
title: Critic Report
description: One independent review of one direction candidate.
type: object
required: [candidate, scores]
additionalProperties: true
properties:
  candidate:
    type: string
    description: "emotional | cinematic | webtoon_native | synthesis"
  episode_id: {type: string}
  loop: {type: integer, minimum: 0}
  first_impression:
    type: string
    description: "Recorded before panel-by-panel analysis. The only fresh read anyone gets."
  scores:
    type: object
    minProperties: 6
    description: "One entry per axis. Either a bare number or {score, evidence}."
    additionalProperties:
      oneOf:
        - {type: number, minimum: 0, maximum: 10}
        - type: object
          required: [score]
          properties:
            score: {type: number, minimum: 0, maximum: 10}
            evidence:
              type: string
              description: "Required for scores >= 9. Must cite a panel ID."
  weighted_total: {type: number, minimum: 0, maximum: 10}
  hard_failures:
    type: array
    items:
      oneOf:
        - {type: string}
        - type: object
          required: [rule]
          properties:
            rule:
              type: string
              enum: [broken_scene_continuity, unreadable_dialogue_order,
                     character_identity_mismatch, missing_climax_or_reveal]
            panel_id: {type: string}
            detail: {type: string}
  strengths:
    type: array
    items:
      oneOf:
        - {type: string}
        - type: object
          required: [note]
          properties:
            panel_id: {type: string}
            note: {type: string}
  problems:
    type: array
    items:
      type: object
      required: [problem, revision]
      properties:
        panel_id: {type: string}
        severity: {type: string, enum: [blocking, major, minor]}
        axis:
          type: string
          enum: [narrative_clarity, emotional_impact, visual_composition,
                 pacing_scroll, reading_flow, continuity]
        problem: {type: string}
        revision:
          type: string
          description: "A concrete change. A problem without a fix is a complaint."
        owner:
          type: string
          description: "The specialist responsible for the fix."
  verdict: {type: string, enum: [pass, revise]}
