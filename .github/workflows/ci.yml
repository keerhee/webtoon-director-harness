name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Validate the worked example
        run: python scripts/validate_artifacts.py examples/sample_episode --strict

      - name: Validate the example handoff package
        run: python scripts/validate_handoff.py examples/sample_episode/06_handoff

      - name: Score the example reviews
        # Candidate reviews are expected to fail the gate; only the synthesis must pass.
        run: |
          python scripts/score_direction.py examples/sample_episode/03_reviews/critic_*.yaml --quiet || true
          python scripts/score_direction.py examples/sample_episode/03_reviews/critic_synthesis.yaml

      - name: Score the example Stage 0.5 breakdown
        # dense and economical are expected to fail; the selected cut must pass.
        run: |
          python scripts/score_direction.py examples/sample_episode/00_input/breakdown/critic_*.yaml --gate breakdown --quiet || true
          python scripts/score_direction.py examples/sample_episode/00_input/breakdown/critic_spacious.yaml --gate breakdown

      - name: Smoke-test episode init
        run: |
          python scripts/init_episode.py ci_demo --from-example
          test -f _workspace/ci_demo/00_input/normalized_input.yaml
